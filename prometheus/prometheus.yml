global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'keycloak-cluster'
    environment: 'research'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Rule files
# rule_files:
#   - "alerts/*.yml"

scrape_configs:
  # ========================================
  # Prometheus itself
  # ========================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ========================================
  # Keycloak Metrics (port 9000)
  # ========================================
  - job_name: 'keycloak'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'keycloak-1:9000'
          - 'keycloak-2:9000'
          - 'keycloak-3:9000'
        labels:
          service: 'keycloak'
          cluster: 'main'
    scrape_interval: 10s

  # ========================================
  # HAProxy Stats
  # ========================================
  - job_name: 'haproxy'
    static_configs:
      - targets: ['haproxy-exporter:9101']
        labels:
          service: 'haproxy'
    scrape_interval: 5s

  # ========================================
  # Node Exporter (System Metrics)
  # ========================================
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
          instance: 'docker-host'
    scrape_interval: 10s

  # ========================================
  # PostgreSQL Exporter
  # ========================================
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgresql'
          database: 'keycloak'
    scrape_interval: 15s